-radius:0;color:var(--accent);background:transparent;margin-bottom:19px}.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.keypad button{font:20px 'IBM Plex Mono',monospace;background:var(--wash);color:var(--ink);border:0;border-radius:var(--radius);min-height:45px}.keypad button.function{font-size:15px;color:var(--muted);background:transparent;border:1px solid var(--line)}.keypad button.enter{background:var(--accent);color:var(--on);grid-column:4;grid-row:3/5;font-size:26px}.keypad svg{width:21px;height:21px;vertical-align:middle}.estimate .question{margin-bottom:21px}.estimate .mock-top{margin-bottom:19px}.estimate .estimate-caption{font-size:11px;color:var(--muted);text-align:center;margin:16px 0 0;min-height:17px}.score-screen{text-align:center;padding-top:39px}.score-brand{font:400 42px 'Newsreader',Georgia,serif;letter-spacing:-4px;margin-bottom:27px}.score-brand span{color:var(--accent)}.score-person{font:12px 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;gap:9px;overflow-wrap:anywhere;color:var(--accent)}.score-person .person-symbol{font:26px Georgia,serif}.score-label{font-size:13px;color:var(--muted);margin:29px 0 0}.final-number{font:400 65px/1.1 'IBM Plex Mono',monospace;letter-spacing:-4px;margin:8px 0 0;color:var(--ink);animation:score-arrive .6s ease-out both}.score-unit{font-size:11px;color:var(--muted)}.score-subtitle{font-size:12px;color:var(--muted);margin:24px 0 18px}.score-tiles{display:flex;justify-content:center;gap:7px;margin-bottom:26px}.score-tiles span{background:var(--wash);color:var(--accent);width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius);font-size:16px;animation:tile-arrive .4s ease-out both}.score-tiles span:nth-child(2){animation-delay:.07s}.score-tiles span:nth-child(3){animation-delay:.14s;background:var(--paper);border:1px solid var(--line);color:var(--muted)}.score-tiles span:nth-child(4){animation-delay:.21s}.copy-status{font-size:12px;color:var(--accent);min-height:25px;margin:13px 0 25px}.preview-notice{color:var(--muted);font-size:11px;padding-top:20px;border-top:1px solid var(--line);margin-top:23px}.sample-copy{width:100%;height:110px;font:11px/1.5 'IBM Plex Mono',monospace;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:9px;margin:8px 0}.footer{margin-top:40px;border-top:1px solid #d5d2cd;padding-top:20px;color:#847d87;display:flex;justify-content:space-between;gap:20px;font-size:12px}.help-note{margin:15px 0 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}.focus .mock-screen{max-width:470px;margin:auto;min-height:610px;padding-top:30px}.focus .question{font-size:40px;min-height:130px}.focus .modernist .question{font-size:35px}.focus .cultural .question{font-size:42px}.focus .study-heading{margin-bottom:17px}.focus .study-foot{padding-left:5px}.studies.focus .mock{padding:0 24px}.mock button:focus-visible,.mock input:focus-visible{outline-color:var(--accent)}

<body>
<div class="shell">
<header class="site-head"><div class="wordmark">4σ <span>/ designspace</span></div><div class="site-actions"><a href="/">Back to game ↗</a><form method="post" action="/designspace"><input type="hidden" name="action" value="logout"><button class="logout" type="submit">Lock page</button></form></div></header>
<section class="hero"><h1>Precision, with personality.</h1><p>Three directions for Four Sigma. Same question, same game. A different feeling.</p></section>
<div class="toolbar"><div class="stages" role="group" aria-label="Preview screen"><button type="button" data-stage="welcome" aria-pressed="false">Welcome</button><button type="button" data-stage="estimate" aria-pressed="false">Estimate</button><button type="button" data-stage="range" aria-pressed="true">Range</button><button type="button" data-stage="score" aria-pressed="false">Score</button></div><label class="view-picker">View <select id="view"><option value="all">Compare all three</option><option value="editorial">A · Editorial</option><option value="modernist">B · Modernist</option><option value="cultural">C · Cultural</option></select></label></div>
<main class="studies" id="studies" aria-label="Design studies"></main>
<footer class="footer"><span>Try the controls. Changes appear in all three studies.</span><span>Design previews · Example names and scores · September 2026</span></footer>
</div>
<script nonce="__NONCE__">
(function(){
'use strict';
const studies=document.getElementById('studies');
const themes=[{id:'editorial',letter:'A',name:'Editorial',mood:'Literate. Warm. Assured.',fonts:'Newsreader + IBM Plex Mono',description:'Paper, ink and a clear note of ultramarine.',colors:['#f7f3e9','#2b2937','#4c49b7','#e4e0f3']},{id:'modernist',letter:'B',name:'Modernist',mood:'Clear. Meticulous. Open.',fonts:'DM Sans + IBM Plex Mono',description:'Chalk, blue and purposeful geometry.',colors:['#f2f5f8','#23364c','#2360a5','#d9e7f5']},{id:'cultural',letter:'C',name:'Cultural',mood:'Curious. Expressive. Sociable.',fonts:'Newsreader italic + IBM Plex Mono',description:'Porcelain, plum and softer gestures.',colors:['#fbf0ec','#482d3c','#8e385d','#f0dbe3']}];
const state={stage:'range',view:'all',lower:60,upper:100,estimate:'80',name:'curious_mind',symbol:'✦'};
const symbols=['✦','∿','❋','◇'];const symbolNames=['Spark','Wave','Bloom','Diamond'];
function escape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const question='<div class="mock-meta"><span>Art &amp; culture</span><span>02 / 04</span></div><h3 class="question">How tall is the Mona Lisa’s wooden panel?</h3>';
const top='<div class="mock-top"><div class="mock-score">0 <small>pts</small></div><button class="mock-help" type="button" aria-label="How to play" aria-expanded="false">?</button></div>';
const progress='<div class="progress" aria-label="Question two of four"><i></i><i></i><i></i><i></i></div>';
function primary(text,action){return '<button class="primary" type="button" data-action="'+action+'"><span>'+text+'</span><span class="arrow" aria-hidden="true">→</span></button>';}
function panel(t){
if(state.stage==='welcome')return '<div class="identity"><div class="mark" aria-hidden="true">'+state.symbol+'</div><h3>Make your mark.</h3><label for="name-'+t.id+'">Username</label><input class="username" id="name-'+t.id+'" value="'+escape(state.name)+'" autocomplete="off" maxlength="20" spellcheck="false"><label class="symbol-label">Your symbol</label><div class="symbol-choices" role="group" aria-label="Your symbol">'+symbols.map((s,i)=>'<button type="button" data-symbol="'+i+'" aria-label="'+symbolNames[i]+'" aria-pressed="'+(state.symbol===s)+'">'+s+'</button>').join('')+'</div>'+primary('Play','play')+'</div>';
if(state.stage==='estimate')return '<div class="estimate">'+top+question+'<label class="input-top" for="estimate-'+t.id+'"><span>Your estimate</span><span>cm</span></label><input id="estimate-'+t.id+'" class="estimate-number" value="'+escape(state.estimate)+'" type="text" inputmode="decimal" aria-label="Your estimate in centimetres"><div class="keypad">'+['7','8','9','delete','4','5','6','clear','1','2','3','→','0','.','E','−'].map(k=>'<button type="button" data-key="'+k+'" class="'+(k==='→'?'enter':['delete','clear','E','−'].includes(k)?'function':'')+'" aria-label="'+({'delete':'Delete digit','clear':'Clear','→':'Set range','E':'Exponent','−':'Minus'}[k]||k)+'">'+(k==='delete'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5h12v14H9l-7-7 7-7Z"/><path d="m12 9 6 6m0-6-6 6"/></svg>':k==='clear'?'C':k)+'</button>').join('')+'</div><p class="estimate-caption" role="status">'+(state.estimate.includes('E')?'Scientific notation':'Your best estimate')+'</p></div>';
if(state.stage==='score')return '<div class="score-screen"><div class="score-brand" aria-label="Four Sigma">4<span>σ</span></div><div class="score-person"><span class="person-symbol" aria-hidden="true">'+state.symbol+'</span><span class="person-name">'+escape(state.name||'curious_mind')+'</span></div><p class="score-label">Your score</p><div class="final-number">278</div><span class="score-unit">points</span><p class="score-subtitle">3 / 4 in range</p><div class="score-tiles" aria-label="Three hits and one miss"><span>✓</span><span>✓</span><span>×</span><span>✓</span></div>'+primary('Share Score','share')+'<p class="copy-status" role="status"></p><p class="preview-notice">Sample score · Design preview</p></div>';
return top+question+'<div class="bounds">'+['lower','upper'].map(part=>'<div class="bound"><label for="'+part+'-'+t.id+'">'+(part==='lower'?'Lower':'Upper')+' bound</label><div class="bound-value"><input type="number" id="'+part+'-'+t.id+'" data-bound="'+part+'" min="0" max="160" step="1" value="'+state[part]+'" aria-label="'+part+' bound in centimetres"><small>cm</small></div></div>').join('')+'</div><div class="ruler"><div class="axis"></div><div class="ticks" aria-hidden="true">'+Array.from({length:21},()=>'<i></i>').join('')+'</div><div class="band"></div><div class="band-line"></div>'+['lower','upper'].map(part=>'<input type="range" data-bound="'+part+'" min="0" max="160" step="1" value="'+state[part]+'" aria-label="Drag '+part+' bound in centimetres">').join('')+'<div class="tick-labels" aria-hidden="true"><span>0</span><span>40</span><span>80</span><span>120</span><span>160</span></div></div><p class="range-caption">Room to be wrong.</p>'+primary('Lock range','lock')+progress;
}
function syncBounds(){for(const input of studies.querySelectorAll('[data-bound]')){input.value=state[input.dataset.bound];input.setAttribute('aria-valuetext',input.value+' centimetres');}for(const band of studies.querySelectorAll('.band,.band-line')){band.style.left=100*state.lower/160+'%';band.style.width=100*(state.upper-state.lower)/160+'%';}}
function render(){studies.classList.toggle('focus',state.view!=='all');studies.innerHTML=themes.map(t=>'<article class="study '+t.id+'" data-theme="'+t.id+'" '+(state.view!=='all'&&state.view!==t.id?'hidden':'')+'><header class="study-heading"><div><h2>'+t.name+'</h2><p class="study-subtitle">'+t.mood+'</p></div><span class="letter">'+t.letter+'</span></header><div class="mock"><div class="mock-screen">'+panel(t)+'</div></div><div class="study-foot"><div class="swatches" aria-label="'+t.description+'">'+t.colors.map(c=>'<i style="background:'+c+'" aria-hidden="true"></i>').join('')+'</div><p><strong>'+t.description+'</strong></p><p>'+t.fonts+'</p></div></article>').join('');for(const b of document.querySelectorAll('[data-stage]'))b.setAttribute('aria-pressed',String(state.stage===b.dataset.stage));syncBounds();}
function setStage(stage){state.stage=stage;render();}
function setEstimate(){const n=Number(state.estimate);if(!state.estimate.trim()||!Number.isFinite(n)||n<0||n>160){for(const p of studies.querySelectorAll('.estimate-caption'))p.textContent='For this preview, enter 0–160 cm.';return;}state.lower=Math.max(0,Math.round(n*.75));state.upper=Math.min(160,Math.round(n*1.25));setStage('range');}
for(const b of document.querySelectorAll('[data-stage]'))b.addEventListener('click',()=>setStage(b.dataset.stage));
document.getElementById('view').addEventListener('change',e=>{state.view=e.target.value;render();});
studies.addEventListener('input',e=>{const el=e.target;if(!(el instanceof HTMLInputElement))return;if(el.dataset.bound){if(el.value==='')return;const n=Number(el.value);if(!Number.isFinite(n))return;const v=Math.max(0,Math.min(160,n));state[el.dataset.bound]=el.dataset.bound==='lower'?Math.min(v,state.upper):Math.max(v,state.lower);syncBounds();}if(el.classList.contains('username')){state.name=el.value;for(const other of studies.querySelectorAll('.username'))if(other!==el)other.value=state.name;}if(el.classList.contains('estimate-number')){state.estimate=el.value;for(const other of studies.querySelectorAll('.estimate-number'))if(other!==el)other.value=state.estimate;}});
studies.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('estimate-number')){e.preventDefault();setEstimate();}});
studies.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.symbol!==undefined){state.symbol=symbols[Number(button.dataset.symbol)];render();return;}if(button.classList.contains('mock-help')){const parent=button.closest('.mock-screen');const old=parent.querySelector('.help-note');if(old){old.remove();button.setAttribute('aria-expanded','false');}else{const note=document.createElement('p');note.className='help-note';note.textContent='Choose a range that contains the answer. Narrower hits earn more; misses score zero.';parent.appendChild(note);button.setAttribute('aria-expanded','true');}return;}if(button.dataset.key!==undefined){const k=button.dataset.key;if(k==='→'){setEstimate();return;}if(k==='delete')state.estimate=state.estimate.slice(0,-1);else if(k==='clear')state.estimate='';else if(state.estimate.length<24)state.estimate+=k==='−'?'-':k;for(const input of studies.querySelectorAll('.estimate-number'))input.value=state.estimate;return;}const action=button.dataset.action;if(action==='play')setStage('estimate');if(action==='lock')setStage('score');if(action==='share'){const text=state.symbol+' '+(state.name||'curious_mind')+' · Four Sigma\n278 points · 3/4 in range\n✓ ✓ × ✓\nDesign preview · Sample score\nhttps://4sig.xyz';const parent=button.closest('.score-screen');const status=parent.querySelector('.copy-status');try{await navigator.clipboard.writeText(text);status.textContent=state.symbol+' Score copied ✓';}catch{status.textContent='Select and copy your sample score.';let area=parent.querySelector('.sample-copy');if(!area){area=document.createElement('textarea');area.className='sample-copy';area.readOnly=true;area.setAttribute('aria-label','Sample share text');status.after(area);}area.value=text;area.focus();area.select();}}});
render();
})();
</script>
</body></html>
