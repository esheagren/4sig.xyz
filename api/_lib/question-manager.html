<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Questions · Four Sigma Designspace</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#f5f0e6;--ink:#352d27;--muted:#786e62;--line:#d9ccbc;--accent:#a54d35}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'DM Sans',sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:inherit;text-underline-offset:3px}.shell{max-width:1120px;margin:auto;padding:28px 36px 60px}.site-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}.wordmark{font:36px/1 Georgia,serif;text-decoration:none;letter-spacing:-3px}.wordmark span{color:var(--accent)}.site-actions{display:flex;align-items:center;gap:22px;font-size:13px}.site-actions a{text-decoration:none;padding:10px 0}.site-actions [aria-current]{border-bottom:1px solid var(--accent);color:var(--accent)}.logout{border:0;background:none;padding:10px 0;color:var(--muted)}.hero{padding:42px 0 26px}.eyebrow{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}h1{font:400 clamp(38px,6vw,58px)/1.1 'Newsreader',Georgia,serif;letter-spacing:-1px;margin:12px 0}p{margin:8px 0;color:var(--muted)}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:22px;background:#fffcf5;border:1px solid var(--line);border-radius:12px}.search{grid-column:1/-1}label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px}input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);min-width:0}input{font-size:16px}.results-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:22px 0 12px}.results-bar p{margin:0}.result-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sort{flex-direction:row;align-items:center;gap:8px}.sort select{width:auto}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:7px;padding:9px 13px}.button:hover{background:#eae1d4}.button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.eye{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}.clear{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:44px}.question-card{border-top:1px solid var(--line);padding:24px 0}.question-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.question-main{min-width:0;flex:1}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--muted)}.number{font-family:'IBM Plex Mono',monospace}.badge{padding:3px 8px;border:1px solid var(--line);border-radius:20px}.ready{color:#486254;background:#e9eee5;border-color:#cbd5c7}.needs_review{color:#865d24;background:#f2e7ce;border-color:#e1d0ae}.retired{background:#eae6df}.question-card h2{font:400 26px/1.23 'Newsreader',Georgia,serif;letter-spacing:-.25px;margin:12px 0 7px;max-width:850px;overflow-wrap:anywhere}.details{font-size:12px;display:flex;flex-wrap:wrap;gap:5px 18px}.row-eye{width:44px;padding:10px;flex:none;margin-top:4px}.answer{background:#ede4d7;border-radius:8px;padding:20px;margin-top:18px;overflow-wrap:anywhere}.answer-value{font:24px/1.3 'IBM Plex Mono',monospace;color:var(--ink);margin:6px 0 15px}.answer p{color:#675b4d}.answer dl{margin:15px 0 0;display:grid;gap:12px}.answer dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.answer dd{margin:3px 0 0}.sources{display:flex;gap:10px 18px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:55px 15px;border-top:1px solid var(--line)}.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:20px}.pager span{color:var(--muted);font-size:12px}.error{border:1px solid #b76a52;padding:16px;border-radius:8px;margin:16px 0}.error p{color:var(--ink)}.error a{display:inline-block;margin-right:15px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.shell{padding:20px 20px 40px}.filters{grid-template-columns:1fr 1fr;padding:16px}.site-actions{gap:14px}.site-actions .game-link{display:none}.hero{padding-top:30px}.results-bar{align-items:flex-start;flex-direction:column}.result-actions{width:100%;justify-content:space-between}.question-card h2{font-size:24px}.question-head{gap:12px}.sort select{max-width:148px}}@media(prefers-reduced-motion:no-preference){.answer{animation:appear .15s ease-out}@keyframes appear{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body><main class="shell">
<header class="site-head"><a class="wordmark" href="/designspace" aria-label="Four Sigma designspace">4<span>σ</span></a><nav class="site-actions" aria-label="Designspace"><a href="/designspace">Design studies</a><a href="/designspace?view=questions" aria-current="page">Questions</a><a class="game-link" href="/">Play ↗</a><form method="post" action="/designspace"><input type="hidden" name="action" value="logout"><button class="logout">Sign out</button></form></nav></header>
<section class="hero"><span class="eyebrow">The editorial desk</span><h1>Question library.</h1><p>Browse the bank. Answers, sources and notes stay hidden until you reveal them.</p></section>
<div class="filters" role="search" aria-label="Filter questions">
<label class="search">Search questions<input id="search" type="search" placeholder="A subject, a place, or a question number…" autocomplete="off"></label>
<label>Status<select id="status"><option value="">All statuses</option><option value="ready">Ready</option><option value="needs_review">Needs review</option><option value="retired">Retired</option></select></label>
<label>Topic<select id="topic"><option value="">All topics</option></select></label>
<label>Type<select id="role"><option value="">All types</option><option value="core">Core</option><option value="reference">Reference</option></select></label>
<label>Review<select id="review"><option value="">Any review date</option><option value="overdue">Overdue</option><option value="soon">Due within 30 days</option><option value="unverified">Not yet verified</option><option value="verified">Verified</option></select></label>
</div>
<div class="results-bar"><p id="count" role="status">Loading questions…</p><div class="result-actions"><button class="clear" id="clear" type="button">Clear filters</button><label class="sort">Sort<select id="sort"><option value="number">Question number</option><option value="topic">Topic</option><option value="prompt">Question A–Z</option><option value="due">Review date</option></select></label><button class="button" id="visibility" type="button" aria-pressed="false" disabled></button></div></div>
<div class="error" id="error" hidden role="alert"><p id="error-text"></p><a href="/designspace?view=questions" id="login" hidden>Sign in</a><button class="button" id="retry" type="button">Try again</button></div>
<div id="questions" aria-label="Question list"></div>
<div class="pager" id="pager" hidden><button class="button" id="previous" type="button">← Previous</button><span id="page-number"></span><button class="button" id="next" type="button">Next →</button></div>
<p class="sr-only" id="announcement" role="status"></p>
<noscript><p>Enable JavaScript to browse and filter the question library.</p></noscript>
</main>
<script nonce="__NONCE__">
const $=id=>document.getElementById(id);
const labels={ready:'Ready',needs_review:'Needs review',retired:'Retired'};
const icon=shown=>`<svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${shown?'':'<path d="m3 3 18 18"/>'}</svg>`;
let bank=[],page=0,visible=new Map(),allShown=false,revision=0,loaded=false;
const size=20;
function node(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el;}
function number(q){return 'Q'+String(q.number).padStart(3,'0');}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}
function filtered(){
 const needle=$('search').value.toLocaleLowerCase().trim(),date=today(),soon=new Date(date+'T12:00:00Z');soon.setUTCDate(soon.getUTCDate()+30);const cutoff=soon.toISOString().slice(0,10);
 return bank.filter(q=>(!needle||[q.prompt,q.topic,q.geography,number(q)].filter(Boolean).join(' ').toLocaleLowerCase().includes(needle))&&(!$('status').value||q.status===$('status').value)&&(!$('topic').value||q.topic===$('topic').value)&&(!$('role').value||q.role===$('role').value)&&({overdue:!!q.reviewDue&&q.reviewDue<date,soon:!!q.reviewDue&&q.reviewDue>=date&&q.reviewDue<=cutoff,unverified:!q.verified,verified:!!q.verified}[$('review').value]??true)).sort((a,b)=>{
 const sort=$('sort').value;if(sort==='topic')return (a.topic||'').localeCompare(b.topic||'')||a.number-b.number;if(sort==='prompt')return a.prompt.localeCompare(b.prompt);if(sort==='due')return (a.reviewDue||'9999').localeCompare(b.reviewDue||'9999')||a.number-b.number;return a.number-b.number;
 });
}
function conceal(){revision++;visible.clear();allShown=false;$('announcement').textContent='';syncEye();}
function syncEye(){const b=$('visibility'),showing=visible.size>0;b.innerHTML=icon(showing);b.append(document.createTextNode(showing?'Hide answers':'Show answers'));b.setAttribute('aria-pressed',String(showing));b.title=showing?'Hide every revealed answer':'Reveal answers on this page';}
function showError(message,login=false){$('error-text').textContent=message;$('error').hidden=false;$('login').hidden=!login;$('retry').hidden=login;}
async function request(params){const response=await fetch('/api/designspace?'+new URLSearchParams(params),{credentials:'same-origin',cache:'no-store'});if(response.status===401){conceal();render();showError('Your designspace session has expired.',true);throw Error('Sign in to continue.');}if(!response.ok)throw Error('Could not load the question library. Please try again.');return response.json();}
function appendAnswer(card,data){
 const box=node('section',undefined,'answer');box.setAttribute('aria-label','Answer and editorial notes');box.append(node('span',data.placeholder?'Unfinished record':'Stored answer','eyebrow'));
 const numeric=Number(data.answer);const formatted=data.placeholder?'No researched answer':(Math.abs(numeric)!==0&&(Math.abs(numeric)<.0001||Math.abs(numeric)>=1e15)?String(data.answer):numeric.toLocaleString('en-US',{maximumSignificantDigits:15}))+(data.unit?' '+data.unit:'');
 box.append(node('p',formatted,'answer-value'));
 if(data.context)box.append(node('p',data.context));
 const dl=node('dl');for(const [title,value]of [['Definition',data.definition],['Editorial notes',data.notes]])if(value){dl.append(node('dt',title),node('dd',value));}box.append(dl);
 const links=node('div',undefined,'sources'),names=(data.source||'').split(';');for(const [index,raw]of(data.sourceUrl||'').split(';').entries()){try{const url=new URL(raw.trim());if(!['https:','http:'].includes(url.protocol)||url.username||url.password)continue;const link=node('a',(names[index]||url.hostname).trim()+' ↗');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';links.append(link);}catch{}}
 box.append(links);card.append(box);
}
function render(focusId){
 const list=filtered(),max=Math.max(0,Math.ceil(list.length/size)-1);page=Math.min(page,max);const shown=list.slice(page*size,(page+1)*size);
 $('count').textContent=loaded?`${list.length} of ${bank.length} questions`:'Loading questions…';$('visibility').disabled=!loaded||!shown.length;syncEye();
 const fragment=document.createDocumentFragment();for(const q of shown){const card=node('article',undefined,'question-card'),head=node('div',undefined,'question-head'),main=node('div',undefined,'question-main'),meta=node('div',undefined,'meta');
 meta.append(node('span',number(q),'number'),node('span',labels[q.status]||q.status,'badge '+q.status),node('span',q.topic||'Unassigned'),node('span',q.role==='reference'?'Reference':'Core'));
 const title=node('h2',q.prompt);main.append(meta,title);const details=node('p',undefined,'details');for(const item of [q.unit?'Unit: '+q.unit:null,q.period,q.geography,q.verified?'Verified '+q.verified:'Not yet verified',q.reviewDue?'Review '+q.reviewDue:null])if(item)details.append(node('span',item));main.append(details);
 const eye=node('button',undefined,'button row-eye');eye.id='eye-'+q.id;eye.type='button';eye.innerHTML=icon(visible.has(q.id));eye.setAttribute('aria-label',(visible.has(q.id)?'Hide':'Reveal')+' answer for '+number(q));eye.title=(visible.has(q.id)?'Hide':'Reveal')+' answer';eye.setAttribute('aria-expanded',String(visible.has(q.id)));eye.onclick=()=>toggleOne(q,eye);head.append(main,eye);card.append(head);if(visible.has(q.id))appendAnswer(card,visible.get(q.id));fragment.append(card);
 }
 if(loaded&&!list.length){const empty=node('div',undefined,'empty');empty.append(node('h2','No matching questions'),node('p','Try another search or clear the filters.'));fragment.append(empty);}
 $('questions').replaceChildren(fragment);$('pager').hidden=!loaded||!list.length;$('previous').disabled=page===0;$('next').disabled=page>=max;$('page-number').textContent=`Page ${page+1} of ${max+1}`;if(focusId)$(focusId)?.focus({preventScroll:true});
}
async function toggleOne(q,button){
 if(visible.has(q.id)){visible.delete(q.id);allShown=false;render(button.id);return;}
 const version=revision;button.disabled=true;try{const data=await request({data:'answers',ids:q.id});if(version!==revision)return;visible.set(q.id,data.answers[0]);render(button.id);$('announcement').textContent='Answer revealed for '+number(q);}catch(error){if(version===revision)showError(error.message);}finally{button.disabled=false;}
}
$('visibility').onclick=async()=>{
 if(allShown||visible.size){conceal();render();return;}
 const version=revision,ids=filtered().slice(page*size,(page+1)*size).map(q=>q.id);$('visibility').disabled=true;try{const data=await request({data:'answers',ids:ids.join(',')});if(version!==revision)return;for(const answer of data.answers)visible.set(answer.id,answer);allShown=true;render();$('announcement').textContent='Answers revealed on this page.';}catch(error){if(version===revision)showError(error.message);}finally{if(version===revision)$('visibility').disabled=false;}
};
function change(){conceal();page=0;$('error').hidden=true;render();}
for(const id of ['status','topic','role','review','sort'])$(id).onchange=change;$('search').oninput=change;
$('clear').onclick=()=>{for(const id of ['search','status','topic','role','review'])$(id).value='';change();};
function move(delta){conceal();page+=delta;render();$('count').scrollIntoView({block:'start'});}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
async function load(){conceal();loaded=false;$('error').hidden=true;render();try{const data=await request({data:'questions'});bank=data.questions;loaded=true;const select=$('topic'),selected=select.value;select.replaceChildren(new Option('All topics',''));for(const topic of [...new Set(bank.map(q=>q.topic).filter(Boolean))].sort())select.add(new Option(topic,topic));select.value=selected;for(const status of ['ready','needs_review','retired'])document.querySelector(`#status option[value="${status}"]`).textContent=`${labels[status]} (${bank.filter(q=>q.status===status).length})`;render();}catch(error){if($('login').hidden)showError(error.message);}}
$('retry').onclick=load;
// Returning to this page never restores a revealed answer, including through the browser back cache.
window.addEventListener('pagehide',()=>{conceal();render();});window.addEventListener('pageshow',event=>{if(event.persisted){conceal();render();}});
syncEye();load();
</script></body></html>
